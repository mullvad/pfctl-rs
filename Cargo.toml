[package]
name = "pfctl"
version = "0.7.0"
authors = ["Mullvad VPN"]
license = "MIT/Apache-2.0"
description = "Library for interfacing with the Packet Filter (PF) firewall on macOS"
repository = "https://github.com/mullvad/pfctl-rs"
readme = "README.md"
keywords = ["pf", "firewall", "macos", "packet", "filter"]
categories = ["network-programming", "os", "os::macos-apis", "api-bindings"]
edition = "2024"
rust-version = "1.85.0"

[badges]
travis-ci = { repository = "mullvad/pfctl-rs" }


[dependencies]
bitflags = "2.9.4"
ioctl-sys = "0.8.0"
libc = "0.2.29"
derive_builder = "0.20"
ipnetwork = "0.21.1"
zerocopy = { version = "0.8.27", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
assert_matches = "1.1.0"
uuid = { version = "1.8.0", features = ["v4"] }
scopeguard = "1.0"
tun = "0.7.4"

# These are here because `tun` specify their lower bounds on these dependencies.
# So for our `minimal-versions` CI job to pass, we need these here.
# Fixed in tun in https://github.com/meh/rust-tun/pull/146.
# These can be removed once those fixes are released and we are able to upgrade
# to the latest version.
ipnet = "2.6.0"
log = "0.4.22"


[package.metadata.cargo-shear]
# See comment on these dependencies. Can be un-ignored once we upgrade `tun`
ignored = ["ipnet", "log"]
